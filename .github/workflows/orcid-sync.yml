# Every Monday, add any new papers from Max's ORCID record to the Papers page.
# Run it any time from the repo's Actions tab: "Update papers from ORCID" → "Run workflow".
name: Update papers from ORCID

on:
  schedule:
    - cron: "0 13 * * 1" # Mondays 13:00 UTC (8am Minneapolis in winter)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add new ORCID papers to the page
        run: python3 scripts/sync_orcid.py

      - name: Publish if anything changed
        run: |
          if git diff --quiet; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Add new papers from ORCID"
          git push
